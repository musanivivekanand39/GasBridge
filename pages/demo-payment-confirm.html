<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16783d">
  <title>Confirm GasBridge Demo Payment</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: #f1f5f9; }
    .confirm-card { width: min(100%, 470px); padding: 2rem; text-align: center; }
    .confirm-icon { width: 64px; height: 64px; margin: 0 auto 1rem; display: grid; place-items: center; border-radius: 50%; background: #dcfce7; color: #15803d; font-size: 2rem; }
    .confirm-status { margin: 1rem 0 1.5rem; color: #475569; line-height: 1.6; }
    .demo-label { display: inline-block; margin-bottom: 1rem; padding: .35rem .65rem; border-radius: 99px; background: #fef3c7; color: #92400e; font-size: .8rem; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card confirm-card">
    <div class="confirm-icon" id="confirm-icon">…</div>
    <span class="demo-label">ACADEMIC DEMO · NO MONEY TRANSFERRED</span>
    <h1 id="confirm-title">Confirming demo payment</h1>
    <p class="confirm-status" id="confirm-status">Please keep this page open while GasBridge confirms your booking.</p>
    <a class="btn btn-primary" href="customer-booking.html">Return to LPG booking</a>
  </main>
  <script type="module">
    import { confirmDemoPaymentFromLink } from '../js/firestore.js';

    const params = new URLSearchParams(window.location.search);
    const status = document.getElementById('confirm-status');
    const title = document.getElementById('confirm-title');
    const icon = document.getElementById('confirm-icon');
    try {
      await confirmDemoPaymentFromLink({
        bookingId: params.get('bookingId'),
        confirmationId: params.get('confirmationId'),
        token: params.get('token')
      });
      icon.textContent = '✓';
      title.textContent = 'QR scan received';
      status.textContent = 'GasBridge received your demo confirmation. The original checkout is now completing your booking.';
    } catch (error) {
      icon.textContent = '!';
      icon.style.background = '#fee2e2';
      icon.style.color = '#b91c1c';
      title.textContent = 'Payment link unavailable';
      status.textContent = error.code === 'permission-denied'
        ? 'This link expired or is not valid. Return to LPG booking and start a new payment.'
        : error.message || 'This payment link expired or is invalid. Return to LPG booking and try again.';
    }
  </script>
</body>
</html>
